services:
  catalogdb:
    container_name: catalogdb
    restart: always
    volumes:  
      - mongo_data:/data/db
    ports:
      - "27017:27017"
  
  orderdb:
    container_name: orderdb
    environment:
      SA_PASSWORD: "********"
      ACCEPT_EULA: "sa"
    restart: always
    ports:
      - "1433:1433"    

  rabbitmq:
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  basketdb:
     container_name: basketdb
     restart: always
     ports:
      - "6379:6379"
  
  pgadmin:
    container_name: pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=1234
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/root/.pgadmin      

  portainer:
    container_name: portainer
    restart: always
    ports:
      - "10000:8000"
      - "10001:9000"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock" 
      - "portainer_data:/data" 
  
  discountdb:
    container_name: discountdb
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=Discountdb
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "MongoSettings:ConnectionString=mongodb://catalogdb:27017"
      - ASPNETCORE_HTTP_PORTS=8080
    depends_on:
      - catalogdb
    ports:
      - "8000:8080"

  basket.api:
    container_name: basket.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - "GrpcSettings:DiscountUrl=http://discount.grpc"
      - "EventBusSettings:HostAddress=amqp://guest:guest@rabbitmq:5672"
      - CacheSettings:ConnectionString=basketdb:6379 

    depends_on: 
      - basketdb
      - rabbitmq
    ports:
      - "8001:8080"

  discount.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - "ConnectionSetting:ConnectionString=Server=discountdb;Port=5432;Database=DiscountDb;UserName=admin;password=1234;"
    ports:
      - "8002:8080"


  discount.grpc:
    container_name: discount.grpc
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - "ConnectionSetting:ConnectionString=Server=discountdb;Port=5432;Database=DiscountDb;UserName=admin;password=1234;"
    depends_on:
      - discountdb
    ports:
      - "8003:8080"


  shopping.aggregator:
    container_name: shopping.aggregator
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - "ApiSettings:CatalogUrl=http://catalog.api"
      - "ApiSettings:BasketUrl=http://basket.api"
      - "ApiSettings:OrderingUrl=http://ordering.api"
    depends_on:
      - catalog.api
      - basket.api
      - ordering.api
    ports:
      - "8005:8080"


  ocelotapigw:
    container_name: ocelotapigw
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    depends_on:
      - catalog.api
      - basket.api
      - discount.api
      - ordering.api
    ports:
      - "8010:80"


  ordering.api:
    container_name: ordering.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - "ConnectionStrings:OrderingConnectionString=Server=orderdb;Database=OrderDb;User Id=sa;Password=******;"
      - "EventBusSettings:HostAddress=amqp://guest:guest@rabbitmq:5672"
    ports:
      - 8004:"8080"

